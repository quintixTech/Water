<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#060a12">
<title>QUANTIX TECH Smart Irrigation</title>
<style>
  :root{
    --bg:#060a12;
    --card:#101827;
    --card2:#162238;
    --line:#1f2f4a;
    --cyan:#00e5ff;
    --mag:#e879f9;
    --green:#00e676;
    --amber:#ffab00;
    --blue:#38bdf8;
    --teal:#2dd4bf;
    --coral:#fb7185;
    --red:#ff5252;
    --text:#f8fafc;
    --sub:#94a3b8;
    --rail-base:46px;
  }
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    background:radial-gradient(circle at 60% -10%,#11223d 0%,var(--bg) 58%);
    color:var(--text);
    min-height:100vh;
    padding:10px 10px 24px calc(var(--rail-base) + 10px);
    overflow-x:hidden;
    transition:background .25s ease;
  }
  body.dry-active{
    background:radial-gradient(circle at 60% -10%,#38111b 0%,var(--bg) 62%);
  }
  .rail-backdrop{
    position:fixed;inset:0;background:rgba(2,6,14,.55);
    z-index:75;display:none;backdrop-filter:blur(2px);
  }
  body.rail-open .rail-backdrop{
    display:block;
  }
  .side-rail{
    position:fixed;top:0;left:0;bottom:0;width:var(--rail-base);
    background:rgba(11,18,32,.98);border-right:1px solid var(--line);
    z-index:80;padding:8px 4px;display:flex;flex-direction:column;
    align-items:center;gap:4px;transition:width .2s ease;
    overflow-y:auto;overflow-x:hidden;
  }
  body.rail-open .side-rail{
    width:154px;align-items:stretch;padding:10px 8px;
    box-shadow:8px 0 28px rgba(0,0,0,.55);
  }
  .rail-top{
    width:100%;display:flex;align-items:center;justify-content:center;
    gap:7px;margin-bottom:2px;flex-shrink:0;
  }
  body.rail-open .rail-top{
    justify-content:space-between;
  }
  .rail-logo{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(145deg,#132947,#0b1322);
    border:1px solid rgba(0,229,255,.35);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .rail-brand-txt{
    display:none;font-size:12px;font-weight:900;letter-spacing:.4px;
    color:#fff;white-space:nowrap;
  }
  .rail-brand-txt span{color:var(--cyan)}
  body.rail-open .rail-brand-txt{
    display:inline;
  }
  .rail-toggle{
    width:34px;height:25px;border-radius:8px;
    background:var(--card2);border:1px solid var(--line);
    color:var(--cyan);display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;flex-shrink:0;
  }
  body.rail-open .rail-toggle{
    width:auto;padding:0 8px;gap:4px;
  }
  .rail-toggle span{
    display:none;font-size:10px;font-weight:800;color:var(--sub);
  }
  body.rail-open .rail-toggle span{
    display:inline;
  }
  .rail-btn{
    width:36px;min-height:37px;padding:3px 0;border-radius:10px;
    background:transparent;border:1px solid transparent;
    color:var(--sub);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
    cursor:pointer;transition:all .15s ease;flex-shrink:0;
  }
  body.rail-open .rail-btn{
    width:100%;flex-direction:row;justify-content:flex-start;
    min-height:36px;padding:5px 10px;gap:9px;
  }
  .rail-btn svg{
    width:16px;height:16px;flex-shrink:0;
    color:var(--ico-col, var(--cyan));
  }
  .rail-btn span{
    font-size:7.5px;font-weight:800;letter-spacing:.1px;line-height:1;
    white-space:nowrap;
  }
  body.rail-open .rail-btn span{
    font-size:11px;
  }
  .rail-btn:hover{
    background:var(--card2);color:#fff;border-color:var(--line);
  }
  .rail-btn.active{
    background:rgba(255,255,255,.07);
    color:#fff;
    border-color:var(--ico-col, var(--cyan));
  }
  .wrap{max-width:720px;margin:0 auto;min-width:0}
  .appbar{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:10px 12px;background:var(--card);border-radius:14px;
    border:1px solid var(--line);margin-bottom:10px;
  }
  .brand{font-weight:900;font-size:15px;letter-spacing:.3px;white-space:nowrap}
  .brand span{color:var(--cyan)}
  .sub{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap}
  .pill{
    padding:5px 10px;border-radius:999px;font-size:10.5px;font-weight:900;
    background:#2a0d12;color:var(--red);border:1px solid rgba(255,82,82,.4);
    white-space:nowrap;flex-shrink:0;
  }
  .pill.on{background:#092533;color:var(--green);border-color:rgba(0,230,118,.35)}
  .page-view{display:none;animation:fadeIn .16s ease}
  .page-view.active{display:block}
  @keyframes fadeIn{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
  .page-head{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    margin-bottom:10px;padding:0 2px;
  }
  .page-head-title{font-size:13px;font-weight:900;letter-spacing:.4px;color:var(--cyan)}
  .page-head-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .lock-btn{
    width:auto;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:800;
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(255,171,0,.14);color:var(--amber);
    border:1px solid rgba(255,171,0,.45);
  }
  .lock-btn.unlocked{
    background:rgba(0,230,118,.14);color:var(--green);
    border:1px solid rgba(0,230,118,.45);
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:0}
  @media(min-width:520px){
    .grid4{grid-template-columns:repeat(4,1fr)}
  }
  .card{
    background:var(--card);border-radius:14px;padding:12px;
    border:1px solid var(--line);margin-bottom:10px;
    min-width:0;transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;
  }
  .card.dry-alert{
    background:linear-gradient(160deg,#250d14 0%,var(--card) 70%);
    border-color:rgba(255,82,82,.7);
    box-shadow:0 0 0 1px rgba(255,82,82,.25),0 8px 24px rgba(255,82,82,.16);
  }
  .z1{border-top:3px solid var(--cyan)}
  .z2{border-top:3px solid var(--mag)}
  .card.dry-alert.z1,.card.dry-alert.z2{border-top:3px solid var(--red)}
  .z-head{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:11px;font-weight:800}
  .z1 .z-head{color:var(--cyan)}
  .z2 .z-head{color:var(--mag)}
  .card.dry-alert .z-head{color:var(--red)}
  .chip{
    font-size:10px;padding:2px 7px;border-radius:999px;
    background:var(--card2);color:var(--sub);border:1px solid var(--line);
    white-space:nowrap;flex-shrink:0;
  }
  .chip.run{color:var(--green);border-color:rgba(0,230,118,.35);background:rgba(0,230,118,.08)}
  .chip.man{color:var(--cyan);border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.1)}
  .chip.dry{color:#ff8a80;border-color:rgba(255,82,82,.55);background:rgba(255,82,82,.18)}
  .val{font-size:24px;font-weight:900;margin:6px 0}
  .meter{
    height:8px;background:#09101d;border-radius:999px;overflow:hidden;
    margin:4px 0 7px;border:1px solid #1b2a44;
  }
  .meter-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#00c853,#00e676);
    transition:width .3s ease;
  }
  .meter-fill.dry{
    background:linear-gradient(90deg,#ff1744,#ff5252);
  }
  .stat{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub)}
  .stat b{color:#fff}
  .title{
    font-size:12.5px;font-weight:800;color:var(--cyan);margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;
  }
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:9px 0;flex-wrap:wrap}
  label{font-size:12px;color:var(--sub)}
  input{
    background:#090f1b;border:1px solid #293954;color:#fff;
    padding:6px 8px;border-radius:9px;font-size:12.5px;font-weight:700;
    width:72px;text-align:center;transition:opacity .15s ease,border-color .15s ease;
  }
  input[type="date"]{
    width:auto;min-width:126px;text-align:left;padding:6px 8px;font-size:11.5px;
    color-scheme:dark;
  }
  input:focus{outline:none;border-color:var(--cyan)}
  input:disabled{
    opacity:.48;background:#070b14;border-color:#192438;color:#94a3b8;cursor:not-allowed;
  }
  .input-wide{width:100%;text-align:left;padding:9px 11px}
  .wifi-status{
    font-size:11.5px;color:var(--sub);background:#09101d;
    border:1px solid #1b2a44;border-radius:10px;padding:8px 10px;margin-bottom:10px;
  }

  /* Control Graphical Animation Stage */
  .anim-stage{
    background:linear-gradient(180deg,#080f1c 0%,#0b1426 100%);
    border:1px solid #1c2e4a;border-radius:13px;
    padding:10px;margin-bottom:10px;position:relative;overflow:hidden;
  }
  .anim-stage.dry-stage{
    border-color:rgba(255,82,82,.65);
    background:linear-gradient(180deg,#200b12 0%,#101827 100%);
  }
  .anim-svg{width:100%;height:152px;display:block}
  .equip-badges{
    display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;
  }
  .eq-pill{
    background:#09101d;border:1px solid #1b2a44;border-radius:9px;
    padding:6px 7px;text-align:center;transition:all .2s ease;
  }
  .eq-pill .eq-name{font-size:9.5px;font-weight:800;color:var(--sub);display:block}
  .eq-pill .eq-st{font-size:11px;font-weight:900;color:#64748b;display:block;margin-top:2px}
  .eq-pill.on-pump{border-color:rgba(0,229,255,.55);background:rgba(0,229,255,.08)}
  .eq-pill.on-pump .eq-st{color:var(--cyan)}
  .eq-pill.on-z1{border-color:rgba(0,230,118,.55);background:rgba(0,230,118,.08)}
  .eq-pill.on-z1 .eq-st{color:var(--green)}
  .eq-pill.on-z2{border-color:rgba(232,121,249,.55);background:rgba(232,121,249,.08)}
  .eq-pill.on-z2 .eq-st{color:var(--mag)}
  .eq-pill.dry-st{border-color:rgba(255,82,82,.6);background:rgba(255,82,82,.12)}
  .eq-pill.dry-st .eq-st{color:#ff8a80}

  @keyframes spinImpeller{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
  }
  @keyframes pulseGlow{
    0%,100%{opacity:.35;transform:scale(.96)}
    50%{opacity:.9;transform:scale(1.06)}
  }
  @keyframes flowDash{
    to{stroke-dashoffset:-24}
  }
  .impeller-spin{
    transform-origin:68px 76px;
    animation:spinImpeller 0.75s linear infinite;
  }
  .pump-halo{
    transform-origin:68px 76px;
    animation:pulseGlow 1.1s ease-in-out infinite;
  }
  .flow-line-anim{
    stroke-dasharray:6 6;
    animation:flowDash .65s linear infinite;
  }

  .run-banner{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:#09101d;border:1px solid #1b2a44;border-radius:11px;
    padding:9px 11px;margin-top:10px;
  }
  .run-banner.active-man{
    border-color:rgba(0,229,255,.55);
    background:rgba(0,229,255,.07);
  }
  .run-timer-val{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:15px;font-weight:900;color:var(--cyan);
  }
  .tbl-wrap{width:100%;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12px;min-width:250px}
  th{color:var(--sub);font-weight:800;padding:6px 3px;border-bottom:1px solid var(--line)}
  td{padding:5px 3px;text-align:center;border-bottom:1px solid #152136}
  td:first-child{color:var(--sub);font-weight:700;white-space:nowrap}
  td input{width:100%;max-width:86px;padding:5px 4px;font-size:12px}
  button{
    width:100%;padding:10px 12px;border:none;border-radius:11px;
    font-weight:800;font-size:12px;cursor:pointer;
    transition:transform .08s ease,opacity .2s ease;
  }
  button:active:not(:disabled){transform:scale(.97)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .b-green{background:var(--green);color:#03140b}
  .b-red{background:var(--red);color:#fff}
  .b-z1{background:#0284c7;color:#fff}
  .b-z2{background:#a21caf;color:#fff}
  .b-cyan{background:var(--cyan);color:#04151c;margin-top:8px}
  .b-ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);margin-top:7px}
  .msg{
    text-align:center;font-size:12px;font-weight:700;min-height:18px;
    color:var(--green);margin-bottom:8px;padding:2px 6px;
  }
  .dbg{
    font-size:11px;color:var(--sub);background:#09101d;border:1px solid #1b2a44;
    border-radius:12px;padding:10px;line-height:1.5;word-break:break-word;
  }

  /* Insight Graph & Controls */
  .mode-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
  .mode-btn{
    padding:7px 6px;border-radius:9px;background:var(--card2);
    border:1px solid var(--line);color:var(--sub);font-size:11px;font-weight:800;
  }
  .mode-btn.active{
    background:rgba(0,229,255,.15);border-color:var(--cyan);color:#fff;
  }
  .metric-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
  .metric-btn{
    padding:6px 6px;border-radius:9px;background:#09101d;
    border:1px solid #1b2a44;color:var(--sub);font-size:10px;font-weight:800;
  }
  .metric-btn.active{
    background:rgba(232,121,249,.14);border-color:var(--mag);color:#fff;
  }
  .chart-box{
    background:#09101d;border:1px solid #1b2a44;border-radius:12px;
    padding:8px;position:relative;
  }
  .chart-svg{width:100%;height:200px;display:block;touch-action:manipulation}
  .legend-row{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
    gap:8px;font-size:10.5px;color:var(--sub);margin-top:6px;
  }
  .leg-item{display:inline-flex;align-items:center;gap:5px;font-weight:700}
  .leg-dot{width:9px;height:9px;border-radius:50%}
  .kpi-mini{
    background:#09101d;border:1px solid #1b2a44;border-radius:10px;
    padding:8px;text-align:center;
  }
  .kpi-mini span{display:block;font-size:9px;color:var(--sub);font-weight:700}
  .kpi-mini b{display:block;font-size:12.5px;font-weight:900;margin-top:2px;color:#fff}

  /* Theme-matched DRY popup modal */
  .dry-modal-backdrop{
    position:fixed;inset:0;background:rgba(4,8,16,.72);
    z-index:120;display:none;align-items:center;justify-content:center;
    padding:16px;backdrop-filter:blur(4px);
  }
  .dry-modal-backdrop.show{
    display:flex;
  }
  .dry-modal{
    width:100%;max-width:340px;
    background:linear-gradient(165deg,#240c13 0%,var(--card) 42%,var(--card2) 100%);
    border:1px solid rgba(255,82,82,.65);
    border-top:3px solid var(--red);
    border-radius:16px;padding:16px;
    box-shadow:0 16px 40px rgba(0,0,0,.65),0 0 24px rgba(255,82,82,.22);
    animation:popIn .18s ease;
  }
  @keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  .dry-modal-head{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    margin-bottom:8px;
  }
  .dry-modal-title{
    font-size:14px;font-weight:900;color:#ff8a80;letter-spacing:.3px;
    display:flex;align-items:center;gap:6px;
  }
  .dry-modal-body{
    font-size:13px;font-weight:800;color:var(--text);line-height:1.45;margin-bottom:12px;
  }
  .dry-modal-sub{
    font-size:11px;font-weight:500;color:var(--sub);margin-top:4px;
  }
</style>
</head>
<body>
<div class="rail-backdrop" onclick="setRailOpen(false)"></div>

<!-- DRY WARNING POPUP -->
<div class="dry-modal-backdrop" id="dryModalBackdrop" onclick="dismissDryPopup()">
  <div class="dry-modal" onclick="event.stopPropagation()">
    <div class="dry-modal-head">
      <div class="dry-modal-title">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#ff5252" stroke-width="2.3">
          <path d="M12 3L2.5 19.5h19L12 3Z" fill="rgba(255,82,82,.18)"/>
          <path d="M12 9v5M12 17h.01" stroke-linecap="round"/>
        </svg>
        <span>DRY ALERT</span>
      </div>
      <span class="chip dry" id="dryTimerChip">5s</span>
    </div>
    <div class="dry-modal-body" id="dryModalText">
      Pump is dry
      <div class="dry-modal-sub">Auto STOP ALL in 5 seconds (beep continues)...</div>
    </div>
    <button type="button" class="b-red" onclick="dismissDryPopup()">OK / Dismiss</button>
  </div>
</div>

<nav class="side-rail" id="sideRail" aria-label="Page Navigation Rail">
  <div class="rail-top">
    <div class="rail-logo" title="QUANTIX TECH">
      <svg viewBox="0 0 28 28" width="20" height="20" fill="none">
        <circle cx="14" cy="14" r="9.5" stroke="#00e5ff" stroke-width="2.2"/>
        <circle cx="14" cy="14" r="4" stroke="#00e676" stroke-width="1.8"/>
        <path d="M17.5 17.5L23.5 23.5" stroke="#ffab00" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="rail-brand-txt">QUAN<span>TIX</span></span>
  </div>

  <button type="button" class="rail-toggle" id="railToggleBtn" onclick="toggleRailOpen()" title="Expand / Collapse Menu">
    <svg id="railToggleIcon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18l6-6-6-6"/>
    </svg>
    <span id="railToggleLabel">Menu</span>
  </button>

  <button type="button" class="rail-btn active" style="--ico-col:#00e5ff" data-page="pageZones" onclick="openPage('pageZones', this)" title="Home Page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
      <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1v-9.5Z" fill="rgba(0,229,255,.18)" stroke-linejoin="round"/>
    </svg>
    <span>HOME</span>
  </button>

  <button type="button" class="rail-btn" style="--ico-col:#00e676" data-page="pageControl" onclick="openPage('pageControl', this)" title="Control Page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
      <polygon points="6 4 20 12 6 20 6 4" fill="rgba(0,230,118,.2)"/>
    </svg>
    <span>CTRL</span>
  </button>

  <button type="button" class="rail-btn" style="--ico-col:#ffab00" data-page="pageSchedule" onclick="openPage('pageSchedule', this)" title="Schedule Page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
      <circle cx="12" cy="12" r="8.5" fill="rgba(255,171,0,.16)"/>
      <path d="M12 7.5V12l3 2" stroke-linecap="round"/>
    </svg>
    <span>SCH</span>
  </button>

  <button type="button" class="rail-btn" style="--ico-col:#e879f9" data-page="pageBands" onclick="openPage('pageBands', this)" title="Moisture ML Page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M4 18V11M10 18V7M16 18V13M22 18V4" stroke-linecap="round"/>
    </svg>
    <span>ML</span>
  </button>

  <button type="button" class="rail-btn" style="--ico-col:#2dd4bf" data-page="pageRtc" onclick="openPage('pageRtc', this)" title="RTC Clock Page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
      <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="rgba(45,212,191,.16)"/>
      <path d="M3.5 9.5H20.5M8 3v4M16 3v4" stroke-linecap="round"/>
    </svg>
    <span>RTC</span>
  </button>
