<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#060a12">
<title>QUANTIX TECH Smart Irrigation</title>
<style>
  :root{
    --bg:#060a12;
    --card:#101827;
    --card2:#162238;
    --line:#1f2f4a;
    --cyan:#00e5ff;
    --mag:#e879f9;
    --green:#00e676;
    --red:#ff5252;
    --text:#f8fafc;
    --sub:#94a3b8;
  }
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    background:radial-gradient(circle at 60% -10%,#11223d 0%,var(--bg) 58%);
    color:var(--text);
    min-height:100vh;
    padding:12px;
  }
  .wrap{max-width:720px;margin:0 auto}
  .appbar{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:12px 14px;background:var(--card);border-radius:16px;
    border:1px solid var(--line);margin-bottom:12px;
  }
  .brand{font-weight:900;font-size:16px;letter-spacing:.4px}
  .brand span{color:var(--cyan)}
  .sub{font-size:11.5px;color:var(--sub);margin-top:2px}
  .pill{
    padding:6px 11px;border-radius:999px;font-size:11px;font-weight:900;
    background:#2a0d12;color:var(--red);border:1px solid rgba(255,82,82,.4);
  }
  .pill.on{background:#092533;color:var(--green);border-color:rgba(0,230,118,.35)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .card{
    background:var(--card);border-radius:16px;padding:14px;
    border:1px solid var(--line);margin-bottom:12px;
  }
  .z1{border-top:3px solid var(--cyan)}
  .z2{border-top:3px solid var(--mag)}
  .z-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800}
  .z1 .z-head{color:var(--cyan)}
  .z2 .z-head{color:var(--mag)}
  .chip{
    font-size:10.5px;padding:2px 8px;border-radius:999px;
    background:var(--card2);color:var(--sub);border:1px solid var(--line);
  }
  .val{font-size:28px;font-weight:900;margin:8px 0 6px}
  .meter{
    height:9px;background:#09101d;border-radius:999px;overflow:hidden;
    margin:4px 0 8px;border:1px solid #1b2a44;
  }
  .meter-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#00c853,#00e676);
    transition:width .3s ease;
  }
  .stat{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub)}
  .stat b{color:#fff}
  .title{
    font-size:13px;font-weight:800;color:var(--cyan);margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;gap:6px;
  }
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
  label{font-size:12.5px;color:var(--sub)}
  input{
    background:#090f1b;border:1px solid #293954;color:#fff;
    padding:7px 9px;border-radius:10px;font-size:13px;font-weight:700;
    width:80px;text-align:center;
  }
  button{
    width:100%;padding:11px 12px;border:none;border-radius:12px;
    font-weight:800;font-size:12.5px;cursor:pointer;
    transition:transform .08s ease,opacity .2s ease;
  }
  button:active:not(:disabled){transform:scale(.97)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .b-green{background:var(--green);color:#03140b}
  .b-red{background:var(--red);color:#fff}
  .b-z1{background:#0284c7;color:#fff}
  .b-z2{background:#a21caf;color:#fff}
  .b-cyan{background:var(--cyan);color:#04151c;margin-top:8px}
  .msg{text-align:center;font-size:12px;font-weight:700;min-height:18px;color:var(--green);margin-bottom:8px}
  .dbg{
    font-size:11px;color:var(--sub);background:#09101d;border:1px solid #1b2a44;
    border-radius:12px;padding:10px;line-height:1.5;word-break:break-word;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="appbar">
    <div>
      <div class="brand">QUAN<span>TIX</span> TECH</div>
      <div class="sub" id="rtcText">RTC: --/--/---- --:--</div>
    </div>
    <div class="pill" id="linkPill">OFFLINE</div>
  </header>

  <div class="msg" id="msgBox"></div>

  <div class="grid2">
    <div class="card z1" style="margin:0">
      <div class="z-head"><span>ZONE 1 MOISTURE</span><span class="chip" id="band1">--</span></div>
      <div class="val" id="m1Val">--%</div>
      <div class="meter"><div class="meter-fill" id="b1Fill"></div></div>
      <div class="stat"><span>Total Used</span><b id="l1Val">0.00 L</b></div>
    </div>
    <div class="card z2" style="margin:0">
      <div class="z-head"><span>ZONE 2 MOISTURE</span><span class="chip" id="band2">--</span></div>
      <div class="val" id="m2Val">--%</div>
      <div class="meter"><div class="meter-fill" id="b2Fill"></div></div>
      <div class="stat"><span>Total Used</span><b id="l2Val">0.00 L</b></div>
    </div>
  </div>

  <div class="card">
    <div class="title"><span>Quick Control</span><span class="chip" id="modeChip">IDLE</span></div>
    <div class="grid2" style="margin:0">
      <button class="b-green cmd-btn" onclick="sendCmd('start')">START BOTH</button>
      <button class="b-red cmd-btn" onclick="sendCmd('stop')">STOP ALL</button>
    </div>
    <div class="grid2" style="margin-top:8px;margin-bottom:0">
      <button class="b-z1 cmd-btn" onclick="sendCmd('z1')">RUN ZONE 1</button>
      <button class="b-z2 cmd-btn" onclick="sendCmd('z2')">RUN ZONE 2</button>
    </div>
  </div>

  <div class="card">
    <div class="title"><span>Schedule &amp; Flow Calibration</span><span>/settings</span></div>
    <div class="row">
      <label>Schedule 1 (HH:MM)</label>
      <div>
        <input id="s1h" type="number" min="0" max="23" style="width:58px"> :
        <input id="s1m" type="number" min="0" max="59" style="width:58px">
      </div>
    </div>
    <div class="row">
      <label>Flow Cal Z1 / Z2</label>
      <div>
        <input id="c1" type="number" step="0.1" style="width:68px">
        <input id="c2" type="number" step="0.1" style="width:68px">
      </div>
    </div>
    <button class="b-cyan" id="saveBtn" onclick="saveSettings()">Save Settings</button>
  </div>

  <div class="dbg" id="dbgBox">Diag: ready</div>
</div>

<script>
const DB_URL = "https://quantixirrigation-default-rtdb.asia-southeast1.firebasedatabase.app";
const STALE_MS = 30000;
const WRITE_GUARD_MS = 5000;

let lastSeenKey = null;
let lastSeenAt = 0;
let lastWriteAt = 0;
let lastSettingsSig = "";
const editing = new Set();

document.querySelectorAll("input").forEach(el => {
  el.addEventListener("input", () => { if (el.id) editing.add(el.id); });
});

function showMsg(txt, err = false) {
  const b = document.getElementById("msgBox");
  b.style.color = err ? "#ff8a80" : "#00e676";
  b.innerText = txt;
}

function setDiag(txt) {
  document.getElementById("dbgBox").innerText = "Diag: " + txt;
}

function bandLabel(m) {
  if (m < 20) return "<20%";
  if (m < 40) return "20-39%";
  if (m < 60) return "40-59%";
  if (m < 80) return "60-79%";
  return "80-100%";
}

function isOnline() {
  return lastSeenAt > 0 && (Date.now() - lastSeenAt) <= STALE_MS;
}

function updatePill() {
  const pill = document.getElementById("linkPill");
  const online = isOnline();
  pill.className = online ? "pill on" : "pill";
  pill.innerText = online ? "ONLINE" : "OFFLINE";
  document.querySelectorAll(".cmd-btn").forEach(btn => { btn.disabled = !online; });
}

async function sendCmd(cmd) {
  if (!isOnline()) {
    showMsg("ESP is OFFLINE", true);
    return;
  }
  try {
    const res = await fetch(`${DB_URL}/control/cmd.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cmd)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    document.getElementById("modeChip").innerText = cmd === "stop" ? "STOPPED" : ("CMD: " + cmd.toUpperCase());
    showMsg("Command sent: " + cmd.toUpperCase());
    setDiag(`cmd=${cmd} OK`);
  } catch (e) {
    showMsg("Cmd failed: " + e.message, true);
    setDiag(`cmd=${cmd} error: ${e.message}`);
  }
}

async function fetchStatus() {
  try {
    const res = await fetch(`${DB_URL}/status.json`, { cache: "no-store" });
    if (!res.ok) {
      setDiag(`status HTTP ${res.status}`);
      updatePill();
      return;
    }
    const d = await res.json();
    if (!d) {
      setDiag("status is null");
      updatePill();
      return;
    }

    const key = (d.uptimeMs ?? d.lastSeen ?? `${d.time}|${d.m1}|${d.m2}|${d.l1}|${d.l2}`);
    if (String(key) !== String(lastSeenKey)) {
      lastSeenKey = key;
      lastSeenAt = Date.now();
    }

    const m1 = Math.max(0, Math.min(100, Number(d.m1 ?? 0)));
    const m2 = Math.max(0, Math.min(100, Number(d.m2 ?? 0)));

    document.getElementById("rtcText").innerText = "RTC: " + (d.time || "--/--/---- --:--");
    document.getElementById("m1Val").innerText = m1 + "%";
    document.getElementById("m2Val").innerText = m2 + "%";
    document.getElementById("band1").innerText = bandLabel(m1);
    document.getElementById("band2").innerText = bandLabel(m2);
    document.getElementById("b1Fill").style.width = m1 + "%";
    document.getElementById("b2Fill").style.width = m2 + "%";
    document.getElementById("l1Val").innerText = Number(d.l1 ?? 0).toFixed(2) + " L";
    document.getElementById("l2Val").innerText = Number(d.l2 ?? 0).toFixed(2) + " L";
    if (d.status) document.getElementById("modeChip").innerText = String(d.status);

    setDiag(`status OK | key=${key}`);
    updatePill();
  } catch (e) {
    setDiag(`status fetch error: ${e.message}`);
    updatePill();
  }
}

async function fetchSettings() {
  if (Date.now() - lastWriteAt < WRITE_GUARD_MS) return;
  try {
    const res = await fetch(`${DB_URL}/settings.json`, { cache: "no-store" });
    if (!res.ok) return;
    const s = await res.json();
    if (!s) return;

    const sig = [s.s1h, s.s1m, s.c1, s.c2, s.updatedAt].join("|");
    if (sig === lastSettingsSig && editing.size === 0) return;

    ["s1h", "s1m", "c1", "c2"].forEach(id => {
      const inp = document.getElementById(id);
      if (s[id] !== undefined && document.activeElement !== inp && !editing.has(id)) {
        inp.value = s[id];
      }
    });
    lastSettingsSig = sig;
  } catch (e) {}
}

async function saveSettings() {
  const btn = document.getElementById("saveBtn");
  btn.disabled = true;
  showMsg("Saving...");

  const payload = {
    s1h: Number(document.getElementById("s1h").value || 0),
    s1m: Number(document.getElementById("s1m").value || 0),
    c1: Number(document.getElementById("c1").value || 7.5),
    c2: Number(document.getElementById("c2").value || 7.5),
    updatedAt: Date.now()
  };

  try {
    lastWriteAt = Date.now();
    const res = await fetch(`${DB_URL}/settings.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    if (!res.ok) {
      showMsg(`Failed HTTP ${res.status}`, true);
      setDiag(`PATCH failed (${res.status}): ${text}`);
      return;
    }
    ["s1h", "s1m", "c1", "c2"].forEach(id => editing.delete(id));
    lastSettingsSig = "";
    showMsg("Saved to /settings!");
    setDiag(`PATCH OK at ${new Date().toLocaleTimeString()}`);
    await fetchSettings();
  } catch (e) {
    showMsg(`Error: ${e.message}`, true);
    setDiag(`PATCH exception: ${e.message}`);
  } finally {
    btn.disabled = false;
  }
}

setInterval(updatePill, 1000);
setInterval(fetchStatus, 2500);
setInterval(fetchSettings, 3000);
fetchStatus();
fetchSettings();
</script>
</body>
</html>
